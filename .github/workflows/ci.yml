name: CI

on:
  push:
    branches-ignore: [dev]  # dev pushes run CI via build-dev.yml
    tags-ignore: ["**"]     # release tags run CI via build.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: VITE_BASE_API=/api/ npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt --strict
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit dashboard dependencies
        working-directory: app/dashboard
        run: npm audit --audit-level=moderate
