version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app/dashboard
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dashboard-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
