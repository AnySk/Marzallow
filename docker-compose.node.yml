# A Marzallow node: runs Xray on this server for a panel elsewhere.
#   1. In the panel's dashboard open Nodes and download the certificate to
#      /var/lib/marzban-node/ssl_client_cert.pem on this server.
#   2. docker compose -f docker-compose.node.yml up -d
#   3. Add this server under Nodes (port 62050, API port 62051).
# Replaces a Marzban-node install in place: same settings, data directory and certificates.
services:
  marzallow-node:
    image: ghcr.io/anysk/marzallow:latest
    command: node
    restart: always
    network_mode: host
    environment:
      SSL_CLIENT_CERT_FILE: /var/lib/marzban-node/ssl_client_cert.pem
      # SERVICE_PORT: 62050
      # XRAY_API_PORT: 62051
      # INBOUNDS: "VLESS TCP REALITY, VMESS TCP"   # run only these inbounds
    volumes:
      - /var/lib/marzban-node:/var/lib/marzban-node
